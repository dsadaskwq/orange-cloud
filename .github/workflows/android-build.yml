name: Android Cloud Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Orange Cloud OSS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '21'
          cache: gradle

      - name: Check Java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          yes | sdkmanager --licenses || true

      - name: Configure OAuth Client
        working-directory: apps/android
        env:
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
        run: |
          echo "OAUTH_CLIENT_ID=$OAUTH_CLIENT_ID" > local.properties

      - name: Grant execute permission
        working-directory: apps/android
        run: chmod +x gradlew

      - name: Verify Gradle
        working-directory: apps/android
        run: ./gradlew --version

      - name: Build OSS Debug APK
        working-directory: apps/android
        run: ./gradlew :app:assembleOssDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          find apps/android/app/build/outputs/apk -type f -name "*.apk" -print

      - name: Prepare APK
        run: |
          mkdir -p artifacts
          APK=$(find apps/android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi

          cp "$APK" artifacts/orange-cloud-oss-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orange-cloud-android-oss
          path: artifacts/orange-cloud-oss-debug.apk
          if-no-files-found: error
