name: Build2 Orange Cloud Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Orange Cloud OSS Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Orange Cloud
        uses: actions/checkout@v4
        with:
          repository: chen2he/orange-cloud
          ref: main
          fetch-depth: 1

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '21'
          cache: gradle

      - name: Check Java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "JAVA_HOME_21_X64=$JAVA_HOME_21_X64"

      - name: Configure Gradle Java Toolchain
        run: |
          echo "org.gradle.java.installations.paths=$JAVA_HOME" > "$GITHUB_WORKSPACE/gradle.properties"

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager \
            -print \
            -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -print
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER"
          "$SDKMANAGER" --version

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android SDK Licenses
        run: |
          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK
        run: |
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify Android SDK
        run: |
          echo "=== Android SDK ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "SDKMANAGER=$SDKMANAGER"

          echo "=== Android Platform ==="
          test -d "$ANDROID_HOME/platforms/android-36"
          echo "android-36: OK"

          echo "=== Build Tools ==="
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/36.0.0/zipalign"
          echo "build-tools-36.0.0: OK"

          echo "=== Platform Tools ==="
          test -x "$ANDROID_HOME/platform-tools/adb"
          echo "platform-tools: OK"

      - name: Configure OAuth Client
        working-directory: apps/android
        env:
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
        run: |
          if [ -z "$OAUTH_CLIENT_ID" ]; then
            echo "OAUTH_CLIENT_ID secret is empty"
            exit 1
          fi

          echo "OAUTH_CLIENT_ID=$OAUTH_CLIENT_ID" > local.properties

      - name: Restore Android Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is empty"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$GITHUB_WORKSPACE/release.jks"

          if [ ! -s "$GITHUB_WORKSPACE/release.jks" ]; then
            echo "Keystore restore failed"
            exit 1
          fi

          echo "Keystore restored successfully"

      - name: Grant Gradle Execute Permission
        working-directory: apps/android
        run: |
          chmod +x gradlew

      - name: Verify Gradle
        working-directory: apps/android
        run: |
          ./gradlew --version

      - name: Build OSS Debug APK
        working-directory: apps/android
        run: |
          ./gradlew :app:assembleOssDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        run: |
          echo "=== APK files ==="

          find apps/android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      - name: Prepare APK
        run: |
          mkdir -p artifacts

          APK=$(find \
            apps/android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi

          echo "Found APK: $APK"

          cp "$APK" \
            artifacts/orange-cloud-oss-debug-unsigned.apk

      - name: Zipalign APK
        run: |
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"

          if [ ! -x "$ZIPALIGN" ]; then
            echo "zipalign not found"
            exit 1
          fi

          "$ZIPALIGN" \
            -f \
            -p \
            4 \
            artifacts/orange-cloud-oss-debug-unsigned.apk \
            artifacts/orange-cloud-oss-debug-aligned.apk

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          if [ ! -x "$APKSIGNER" ]; then
            echo "apksigner not found"
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "KEYSTORE_PASSWORD is empty"
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "KEY_PASSWORD is empty"
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "KEY_ALIAS is empty"
            exit 1
          fi

          "$APKSIGNER" sign \
            --ks "$GITHUB_WORKSPACE/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out artifacts/orange-cloud-oss.apk \
            artifacts/orange-cloud-oss-debug-aligned.apk

      - name: Verify APK Signature
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          "$APKSIGNER" verify \
            --verbose \
            artifacts/orange-cloud-oss.apk

      - name: Show APK Certificate
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          echo "=== APK Certificate ==="

          "$APKSIGNER" verify \
            --print-certs \
            artifacts/orange-cloud-oss.apk

          echo "=== APK File ==="

          ls -lh artifacts/orange-cloud-oss.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: orange-cloud-oss-android
          path: artifacts/orange-cloud-oss.apk
          if-no-files-found: error
