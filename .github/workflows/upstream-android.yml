name: Build Upstream Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Upstream Orange Cloud OSS Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Upstream
        uses: actions/checkout@v4
        with:
          repository: chen2he/orange-cloud
          ref: main
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Check Java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          yes | sdkmanager --licenses || true

      - name: Configure OAuth Client
        working-directory: apps/android
        env:
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
        run: |
          echo "OAUTH_CLIENT_ID=$OAUTH_CLIENT_ID" > local.properties

      - name: Restore Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.jks"

          if [ ! -s "$GITHUB_WORKSPACE/release.jks" ]; then
            echo "Keystore restore failed"
            exit 1
          fi

          echo "Keystore restored successfully"

      - name: Configure Release Signing
        working-directory: apps/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Grant execute permission
        working-directory: apps/android
        run: chmod +x gradlew

      - name: Verify Gradle
        working-directory: apps/android
        run: ./gradlew --version

      - name: Build OSS Release
        working-directory: apps/android
        run: |
          ./gradlew :app:assembleOssRelease \
            --no-daemon \
            --stacktrace

      - name: Find APK
        run: |
          echo "APK files:"
          find apps/android/app/build/outputs/apk -type f -name "*.apk" -print

      - name: Verify APK Signature
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          APK=$(find apps/android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi

          echo "APK: $APK"

          "$APKSIGNER" verify --verbose "$APK"

          echo "APK signature:"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Prepare APK
        run: |
          mkdir -p artifacts

          APK=$(find apps/android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi

          cp "$APK" artifacts/orange-cloud-oss-release.apk

          ls -lh artifacts/orange-cloud-oss-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orange-cloud-upstream-oss-release
          path: artifacts/orange-cloud-oss-release.apk
          if-no-files-found: error
