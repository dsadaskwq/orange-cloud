name: Build Upstream Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Upstream Orange Cloud OSS Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Upstream
        uses: actions/checkout@v4
        with:
          repository: chen2he/orange-cloud
          ref: main
          fetch-depth: 1

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '21'
          cache: gradle

      - name: Check Java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager \
            -print \
            -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -print
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER"
          "$SDKMANAGER" --version

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android SDK Licenses
        run: |
          yes | "$SDKMANAGER" --licenses || true


      - name: Install Android SDK
        run: |
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"
          
      - name: Configure OAuth Client
        working-directory: apps/android
        env:
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
        run: |
          echo "OAUTH_CLIENT_ID=$OAUTH_CLIENT_ID" > local.properties

      - name: Restore Android signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.jks"

          if [ ! -s "$GITHUB_WORKSPACE/release.jks" ]; then
            echo "Keystore restore failed"
            exit 1
          fi

          echo "Keystore restored successfully"

      - name: Grant execute permission
        working-directory: apps/android
        run: chmod +x gradlew

      - name: Verify Gradle
        working-directory: apps/android
        run: ./gradlew --version

      - name: Build OSS Release APK
        working-directory: apps/android
        run: ./gradlew :app:assembleOssRelease --no-daemon --stacktrace

      - name: Find Release APK
        run: |
          find apps/android/app/build/outputs/apk -type f -name "*.apk" -print

      - name: Prepare APK
        run: |
          mkdir -p artifacts

          APK=$(find apps/android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "Release APK not found"
            exit 1
          fi

          cp "$APK" artifacts/orange-cloud-oss-release-unsigned.apk

      - name: Zipalign APK
        run: |
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"

          if [ ! -f "$ZIPALIGN" ]; then
            echo "zipalign not found"
            exit 1
          fi

          "$ZIPALIGN" -f -p 4 \
            artifacts/orange-cloud-oss-release-unsigned.apk \
            artifacts/orange-cloud-oss-release-aligned.apk

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          if [ ! -f "$APKSIGNER" ]; then
            echo "apksigner not found"
            exit 1
          fi

          "$APKSIGNER" sign \
            --ks "$GITHUB_WORKSPACE/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out artifacts/orange-cloud-oss-release.apk \
            artifacts/orange-cloud-oss-release-aligned.apk

      - name: Verify APK Signature
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          "$APKSIGNER" verify --verbose \
            artifacts/orange-cloud-oss-release.apk

      - name: Show APK Information
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          "$APKSIGNER" verify --print-certs \
            artifacts/orange-cloud-oss-release.apk

          ls -lh artifacts/orange-cloud-oss-release.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: orange-cloud-upstream-oss-release
          path: artifacts/orange-cloud-oss-release.apk
          if-no-files-found: error
